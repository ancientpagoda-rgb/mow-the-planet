name: Apply prominent points HUD

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/points-hud-patch.yml"

permissions:
  contents: write

jobs:
  patch-points-hud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make points obvious
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          index = Path('index.html')
          html = index.read_text()
          old_score = '        <div><span>Score</span><strong id="score-value">0</strong></div>\n'
          if old_score not in html:
              raise SystemExit('score block not found')
          html = html.replace(old_score, '', 1)
          marker = '      </header>\n\n      <section class="status-strip" aria-live="polite">'
          points = '      </header>\n\n      <aside class="points-hud" aria-label="Current score">\n        <span>POINTS</span>\n        <strong id="score-value">0</strong>\n      </aside>\n\n      <section class="status-strip" aria-live="polite">'
          if marker not in html:
              raise SystemExit('header marker not found')
          html = html.replace(marker, points, 1)
          index.write_text(html)
          styles = Path('styles.css')
          css = styles.read_text()
          css = css.replace('grid-template-columns: repeat(5, 1fr);', 'grid-template-columns: repeat(4, 1fr);', 1)
          css += base64.b64decode('').decode()
          styles.write_text(css)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/points-hud-patch.yml
          git add index.html styles.css .github/workflows/points-hud-patch.yml
          git commit -m "Make points score prominent"
          git push
