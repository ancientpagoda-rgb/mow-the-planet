name: Apply crop granary separation

on:
  push:
    branches:
      - agent/crop-granary-separation-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/crop-granary-separation-v2
      - run: python3 .github/scripts/patch-crop-granary.py
      - run: node --check game.js
      - run: rm .github/scripts/patch-crop-granary.py .github/workflows/apply-crop-granary-separation-v2.yml
      - run: git config user.name github-actions[bot] && git config user.email 41898282+github-actions[bot]@users.noreply.github.com && git add -A && git commit -m 'Separate mowing points from crop granary cargo' && git push origin HEAD:agent/crop-granary-separation-v2
